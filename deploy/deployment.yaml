---
# Porter worker Deployment template.
# Typically generated by `porter deploy`, but can be applied manually.
#
# Replace placeholders:
#   ${IMAGE}         - container image (e.g. quay.io/myorg/porter-worker:latest)
#   ${SESSION}       - porter session name
#   ${AGENT_NAME}    - agent name
#   ${BUS_URL}       - WebSocket URL of the orchestrator bus
#   ${NAMESPACE}     - target namespace
#   ${AGENT_CONFIG}  - JSON-encoded AgentConfig

apiVersion: apps/v1
kind: Deployment
metadata:
  name: porter-${SESSION}-${AGENT_NAME}
  namespace: ${NAMESPACE}
  labels:
    app: porter
    session: ${SESSION}
    agent: ${AGENT_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: porter
      session: ${SESSION}
      agent: ${AGENT_NAME}
  template:
    metadata:
      labels:
        app: porter
        session: ${SESSION}
        agent: ${AGENT_NAME}
    spec:
      containers:
        - name: worker
          image: ${IMAGE}
          command: ["deno", "run", "--allow-all", "worker.ts"]
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: porter-${SESSION}-api-key
                  key: ANTHROPIC_API_KEY
            - name: PORTER_AGENT_NAME
              value: ${AGENT_NAME}
            - name: PORTER_BUS_URL
              value: ${BUS_URL}
            - name: PORTER_CONFIG
              value: '${AGENT_CONFIG}'
            - name: PORTER_SESSION
              value: ${SESSION}
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      restartPolicy: Always
