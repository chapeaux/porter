<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="bus-url" content="ws://localhost:8787">
  <title>Porter</title>
  <link rel="icon" href="porter.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#c9a96e">
  <link rel="apple-touch-icon" href="/porter-192.png">
  <link rel="stylesheet" href="porter.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <img src="./porter.svg" alt="Porter: Coordinating Seamless AI Operations">
      <h1>Porter</h1>
    </div>
    <div id="auth-area"></div>
    <button id="config-toggle" class="config-toggle-btn" title="Configuration">&#9881;</button>
  </header>

  <!-- Config panel (flipboard dropdown, hidden by default) -->
  <div id="config-panel" class="config-panel hidden">
    <flipboard-bar label-width="9" value-width="12">
      <flipboard-cell id="fb-models" clickable>
        <span slot="icon" class="fb-gear" data-action="models">&#9881;</span>
        <span slot="label">MODELS</span>
        <span slot="value" id="fb-models-val">--</span>
      </flipboard-cell>
      <flipboard-cell id="fb-mcp" clickable>
        <span slot="icon" class="fb-gear" data-action="mcp">&#9881;</span>
        <span slot="label">MCP</span>
        <span slot="value" id="fb-mcp-val">--</span>
      </flipboard-cell>
      <flipboard-cell id="fb-agents" clickable>
        <span slot="icon" class="fb-gear" data-action="agents">&#9881;</span>
        <span slot="label">AGENTS</span>
        <span slot="value" id="fb-agents-val">--</span>
      </flipboard-cell>
      <flipboard-cell id="fb-teams" clickable>
        <span slot="icon" class="fb-gear" data-action="teams">&#9881;</span>
        <span slot="label">TEAMS</span>
        <span slot="value" id="fb-teams-val">--</span>
      </flipboard-cell>
      <flipboard-cell id="fb-patterns" clickable>
        <span slot="icon" class="fb-gear" data-action="patterns">&#9881;</span>
        <span slot="label">PATTERNS</span>
        <span slot="value" id="fb-patterns-val">--</span>
      </flipboard-cell>
      <flipboard-cell id="fb-federation" clickable>
        <span slot="icon" class="fb-gear" data-action="federation">&#9881;</span>
        <span slot="label">FEDERATION</span>
        <span slot="value" id="fb-federation-val">--</span>
      </flipboard-cell>
      <flipboard-cell id="fb-session" clickable>
        <span slot="icon" class="fb-gear" data-action="session">&#9881;</span>
        <span slot="label">SESSION</span>
        <span slot="value" id="fb-session-val">NO SESSION</span>
      </flipboard-cell>
      <flipboard-cell id="fb-status">
        <span slot="label">CONNECTED</span>
        <span slot="value" id="fb-status-val">--</span>
      </flipboard-cell>
    </flipboard-bar>
    <div style="display:flex;justify-content:flex-end;padding:0.25rem 0.5rem">
      <button id="fb-export" class="team-btn secondary" style="font-size:0.75rem;padding:0.15rem 0.5rem">Export Config</button>
    </div>
  </div>

  <main>
    <div id="loading-indicator" class="loading-indicator">
      <img src="./porter.svg" class="loading-logo" alt="">
      <span class="loading-text">Loading...</span>
    </div>
  </main>

  <!-- Metrics footer (hidden until a session is active) -->
  <footer id="metrics-bar" class="metrics-bar hidden">
    <div class="metrics-inner">
      <span class="metrics-cell" id="m-pattern" title="Pattern status">--</span>
      <span class="metrics-cell metrics-workspace" id="m-workspace" title="Click to copy workspace path">--</span>
      <span class="metrics-cell" id="m-tokens-in" title="Input tokens">IN: --</span>
      <span class="metrics-cell" id="m-tokens-out" title="Output tokens">OUT: --</span>
      <span class="metrics-cell" id="m-api-calls" title="API calls">API: --</span>
      <span class="metrics-cell" id="m-errors" title="Errors">ERR: --</span>
      <span class="metrics-cell" id="m-rate-limits" title="Rate limit hits">LIMITS: --</span>
      <button class="metrics-detail-btn" id="m-memory-btn" title="Browse session memory">Memory</button>
      <button class="metrics-detail-btn" id="m-detail-btn" title="Per-agent detail">&#9662;</button>
    </div>
  </footer>

  <!-- State stores -->
  <connection-store id="connection"></connection-store>
  <agent-store id="agents" persist="porter-agents"></agent-store>
  <message-store id="messages" persist="porter-messages"></message-store>
  <config-store id="config"></config-store>
  <project-store id="projects"></project-store>
  <model-store id="models" persist="porter-models"></model-store>

  <!-- Single reusable dialog -->
  <porter-dialog id="porter-dlg"></porter-dialog>
  <!-- Overlay dialog for nested dialogs (agent editor, credentials, MCP editor) -->
  <porter-dialog id="porter-dlg-overlay"></porter-dialog>

  <!-- ============================================================
       Dialog Templates
       ============================================================ -->

  <!-- Team Builder -->
  <template id="tpl-team-builder">
    <div data-dialog-header>
      <div id="team-steps">
        <span class="step active" data-step="1">Team</span>
        <span class="step" data-step="2">Agents</span>
        <span class="step" data-step="3">Review</span>
      </div>
    </div>
    <div id="team-dialog-body"></div>
    <div data-dialog-footer>
      <button id="team-prev" class="team-btn secondary">Back</button>
      <button id="team-next" class="team-btn primary">Next</button>
    </div>
  </template>

  <!-- Agent Editor -->
  <template id="tpl-agent-editor">
    <div id="agent-dialog-body"></div>
    <div data-dialog-footer>
      <button id="agent-cancel" class="team-btn secondary">Cancel</button>
      <button id="agent-save" class="team-btn primary">Save Agent</button>
    </div>
  </template>

  <!-- Credential Setup -->
  <template id="tpl-cred-setup">
    <div id="cred-dialog-body"></div>
    <div data-dialog-footer>
      <button id="cred-dismiss" class="team-btn secondary">Dismiss</button>
      <button id="cred-save" class="team-btn primary" style="display:none">Update Credentials</button>
    </div>
  </template>

  <!-- Onboarding / Welcome -->
  <template id="tpl-onboarding">
    <div id="onboarding-body"></div>
  </template>

  <!-- MCP Server Editor -->
  <template id="tpl-mcp-editor">
    <div id="mcp-editor-body"></div>
    <div data-dialog-footer>
      <button id="mcp-editor-cancel" class="team-btn secondary">Cancel</button>
      <button id="mcp-editor-save" class="team-btn primary">Save</button>
    </div>
  </template>

  <!-- Session Launcher -->
  <template id="tpl-session-launcher">
    <div id="session-launcher-body"></div>
  </template>

  <!-- Model Setup -->
  <template id="tpl-model-setup">
    <div id="model-dialog-body"></div>
    <div data-dialog-footer>
      <button id="model-dialog-close" class="team-btn secondary">Close</button>
    </div>
  </template>

  <!-- Pattern Manager -->
  <template id="tpl-pattern-manager">
    <div id="pattern-manager-body"></div>
    <div data-dialog-footer>
      <button id="pattern-manager-close" class="team-btn secondary">Close</button>
      <button id="pattern-manager-upload" class="team-btn primary">Upload Pattern</button>
    </div>
  </template>

  <!-- Federation Editor -->
  <template id="tpl-federation-editor">
    <div id="federation-editor-body"></div>
    <div data-dialog-footer>
      <button id="federation-cancel" class="team-btn secondary">Cancel</button>
      <button id="federation-save" class="team-btn primary">Save</button>
    </div>
  </template>

  <!-- Pattern Editor -->
  <template id="tpl-pattern-editor">
    <div id="pattern-editor-body" class="pattern-editor-body"></div>
    <div data-dialog-footer>
      <button id="pattern-editor-cancel" class="team-btn secondary">Cancel</button>
      <button id="pattern-editor-save" class="team-btn primary">Save Pattern</button>
    </div>
  </template>

  <!-- Detail / Content Viewer -->
  <template id="tpl-detail">
    <div id="dialog-body"></div>
  </template>

  <!-- ============================================================
       Shared Component Templates
       ============================================================ -->

  <!-- porter-card -->
  <template id="tmpl-porter-card">
    <div class="porter-card">
      <div class="porter-card-header">
        <span class="card-heading"></span>
        <span class="card-badge" style="display:none"></span>
      </div>
      <div class="card-meta"></div>
      <div class="card-body"><slot></slot></div>
      <div class="card-actions"><slot name="actions"></slot></div>
    </div>
  </template>

  <!-- porter-form-field -->
  <template id="tmpl-porter-form-field">
    <div class="porter-form-field">
      <label class="form-field-label"></label>
      <div class="form-field-slot"><slot></slot></div>
      <div class="field-hint" style="display:none"></div>
      <div class="field-error" style="display:none"></div>
    </div>
  </template>

  <!-- porter-list -->
  <template id="tmpl-porter-list">
    <div class="porter-list">
      <div class="list-loading" style="display:none">Loading...</div>
      <div class="list-empty" style="display:none">No items</div>
      <div class="list-items"><slot></slot></div>
    </div>
  </template>

  <script src="lib/base-element.js"></script>
  <script src="lib/porter-card.js"></script>
  <script src="lib/porter-form-field.js"></script>
  <script src="lib/porter-list.js"></script>
  <script src="flipboard.js"></script>
  <script src="porter-dialog.js"></script>
  <script type="module" src="cpx-model-config.js"></script>
  <script src="solid-auth.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
