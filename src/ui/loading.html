<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Porter -- Starting your workspace</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0;
           display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .container { text-align: center; max-width: 400px; }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid #333;
               border-top-color: #6c63ff; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Starting your Porter workspace...</h1>
    <p class="status" id="status">Provisioning pod</p>
  </div>
  <script>
    async function poll() {
      try {
        const resp = await fetch("/api/pod-status");
        const data = await resp.json();
        if (data.ready) {
          document.getElementById("status").textContent = "Ready! Redirecting...";
          window.location.reload();
        } else {
          document.getElementById("status").textContent = "Pod starting...";
        }
      } catch { /* retry */ }
    }
    setInterval(poll, 2000);
    poll();
  </script>
</body>
</html>
